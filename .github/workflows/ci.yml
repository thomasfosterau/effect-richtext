name: CI

# ONE workflow, ONE command: after checkout, setup and install, each job runs
# `vp run ci`, the task in vite.config.ts that chains every gate (format and
# lint, the type gate, unit tests, browser tests, build, the documentation
# examples, the dependency audit), so CI and a local `vp run ci` are the same
# thing. The task stops at the first failing gate.
#
# This is a published library, so the task runs on a Node matrix: the newest
# LTS line and the newest released Current line (`lts` and `latest`, resolved
# by Vite+; neither resolves to a pre-release). They are the same version
# while the newest release line is itself LTS.
#
# The final `ci` job is the one stable check name for required-check
# rulesets: it succeeds only when every matrix leg did.
#
# Nothing here needs a database, a stage or a credential, so every PR
# (Dependabot's included) runs the whole gate with a read-only token and no
# secrets. Every action is pinned to a commit SHA, except voidzero-dev/setup-vp
# in the setup action, which is pinned to an exact release tag (Dependabot's
# `github-actions` updates keep the pins current), and the checkout never
# persists its credentials.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; each job grants only what it needs.
permissions: {}

jobs:
  test:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=4096
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      # Keyed per matrix leg: a result cached on one Node line must never be
      # replayed as a pass on the other.
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v2-${{ runner.os }}-node-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            vp-task-v2-${{ runner.os }}-node-${{ matrix.node }}-
      - name: Run every gate (vp run ci)
        run: vp run ci

  # The required check. `if: always()` makes it report even when a leg failed
  # or was cancelled; it passes only when the whole matrix succeeded.
  ci:
    name: ci
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every matrix leg to have passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test matrix result: $RESULT"
          test "$RESULT" = "success"
