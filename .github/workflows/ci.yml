name: CI

# ONE required job, ONE required check: the pipeline's task graph lives in
# vite.config.ts (`check`, `test:unit`, `test:browser`, `build`, `docgen`),
# not in GitHub Actions `needs:`. Copied in shape from the effect-web library,
# plus the Chromium install the `browser` test project needs: nothing here
# needs a database, a stage or a credential, so every PR (Dependabot's
# included) runs the whole gate with a read-only token and no secrets. Every
# action is locked to its commit by .github/workflows/actions.lock
# (Dependabot's `github-actions` updates keep the tags current) and the
# checkout never persists its credentials.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=4096
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Restore the Vite+ task cache
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-
      - name: Format and lint
        run: pnpm exec vp check
      - name: Type gate (src + tests, including the type-level tests)
        run: pnpm exec vp run check
      - name: Unit tests (node, happy-dom)
        run: pnpm exec vp run test:unit
      # The `browser` project runs prosemirror-view's suites in real Chromium
      # through Playwright; the runner image does not ship a matching build.
      - name: Install Chromium for the browser tests
        run: pnpm exec vp exec playwright install --with-deps chromium
      - name: Browser tests (Chromium)
        run: pnpm exec vp run test:browser
      - name: Build
        run: pnpm exec vp run build
      # Type-checks AND runs every JSDoc @example against the built dist/.
      - name: Verify documentation examples (docgen)
        run: pnpm exec vp run docgen
      - name: Audit
        run: pnpm audit --audit-level high
