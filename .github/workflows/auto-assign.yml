name: Auto-assign

# Assigns each new pull request to the owner, so it shows up in their
# "assigned to me" views. Dependabot's PRs are assigned by the `assignees` in
# .github/dependabot.yml (and its token here is read-only), so they are
# skipped, as is any PR that already has an assignee.
#
# No checkout and no third-party action: the job only calls `gh pr edit`, so
# nothing from the PR's branch runs with the write-scoped token. Every value
# reaches the script through `env:`, never by `${{ }}` interpolation.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# No permissions by default; the single job grants only what `gh pr edit` needs.
permissions: {}

jobs:
  assign:
    name: Assign the owner
    if: github.actor != 'dependabot[bot]' && toJSON(github.event.pull_request.assignees) == '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Assign
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ASSIGNEE: thomasfosterau
        run: gh pr edit "$PR_URL" --add-assignee "$ASSIGNEE"
