# zizmor (GitHub Actions static analysis) configuration. Run it with
# `uvx zizmor --offline .github`; every workflow and the setup action should
# report no findings beyond what is configured away here, each with its reason.
rules:
  dependabot-cooldown:
    config:
      # The owner's supply-chain policy: pnpm holds a new version for 8 hours
      # (`minimumReleaseAge: 480` in pnpm-workspace.yaml) and Dependabot's
      # cooldown, which counts whole days, waits 1 — longer than pnpm, so a
      # Dependabot PR never proposes a version pnpm would refuse.
      days: 1
  unpinned-uses:
    config:
      policies:
        # setup-vp's README asks for an exact release tag (its moving `v1` tag
        # is frozen at v1.15.0), and the family pins it that way. This is the
        # only action allowed a tag; everything else keeps a commit SHA.
        voidzero-dev/setup-vp: ref-pin
        "*": hash-pin
  self-repository:
    # `./.github/actions/setup` is the documented local-action path; the
    # `$/` spelling buys nothing for a single-repo composite action.
    disable: true
