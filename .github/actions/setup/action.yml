# Composite setup shared by every CI job that needs the toolchain.
# One step: voidzero-dev/setup-vp installs the Vite+ CLI at the version this
# repo pins (the `vite-plus` catalog entry in pnpm-workspace.yaml, which the
# action reads through package.json's `catalog:`), a Node.js runtime and the
# pnpm named by package.json's `packageManager`, restores the pnpm store cache
# (keyed on pnpm-lock.yaml) and runs `vp install --frozen-lockfile`.
# `vp`, `node` and `pnpm` are on PATH afterwards, so later steps call `vp`
# directly; the dev bins (tsc, docgen, fallow, playwright) go through `vp exec`
# or a `vp run` task.
#
# setup-vp is pinned to an exact release tag, not a commit SHA: its README
# asks for that (the moving `v1` tag is frozen), and Dependabot keeps the tag
# current. `.github/zizmor.yml` allows a tag for this one action only.
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Install Vite+ (with Node.js and pnpm), restore the package cache, and install dependencies.
runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1.22.0
      with:
        # The newest LTS line, never a pre-release (a Node 27 alpha hangs some
        # tests). package.json's `engines` sets the floor.
        node-version: "lts"
        cache: true
        run-install: |
          args: ['--frozen-lockfile']
