# One package at the root. Every external version lives in this catalog;
# package.json references only `catalog:` / `catalog:peers`.
catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/docgen": ^4.1.5
  "@effect/language-service": ^0.87.5
  # For tests/bench/run.ts's child processes. Same version as `effect`.
  "@effect/platform-node": 4.1.5
  # `effect-tsgo patch` (in `prepare`) supports only the TypeScript, oxlint and
  # tsrs versions in the `components` table of
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs, and fails `pnpm install`
  # on any other: move it with `@typescript/native` and `vite-plus`.
  "@effect/tsgo": 0.73.4
  "@effect/vitest": 4.1.5
  "@enfect/oxlint": 0.10.0
  "@types/node": ^26.6.6
  # Both peer on the exact `vitest` version.
  "@vitest/browser-playwright": 5.1.1
  "@vitest/coverage-istanbul": 5.1.1
  effect: 4.1.5
  fallow: 3.48.0
  happy-dom: ^21.0.4
  markdown-it: ^15.0.3
  playwright: ^1.65.1
  # The reference implementation, for the benchmarks and their parity test
  # only; never imported from `src/`.
  prosemirror-commands: ^1.7.2
  prosemirror-history: ^1.5.2
  prosemirror-model: ^1.25.13
  prosemirror-schema-list: ^1.6.1
  prosemirror-state: ^1.4.4
  prosemirror-test-builder: ^1.1.1
  prosemirror-transform: ^1.12.7
  prosemirror-view: ^1.44.0
  rope-sequence: ^1.3.4
  # A peer of @effect/docgen, which runs the compiled examples with it.
  tsx: ^4.23.15
  # TS7 (native `tsc`) has no JS API yet, so JS-API consumers (the language
  # service, tsdown's declaration bundler, docgen) get TS6 as `typescript`.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # `vite` and `vitest` equal what vite-plus itself depends on
  # (`npm view vite-plus@<v> dependencies`); `vite` no longer equals vite-plus.
  vite-plus: 1.7.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.1
  w3c-keyname: ^2.2.8

# The ranges the published package declares; raising a floor is breaking.
catalogs:
  peers:
    effect: ^4.0.0

overrides:
  # Two copies of `effect` break Context / Layer / Schema identity.
  effect: "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true

# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up. Build grants stay in `allowBuilds`: a `permissions` entry without `build`
# leaves its package's `allowBuilds` grant in force.
permissions:
  fallow:
    skills: [fallow]

skills:
  dirs: [.claude/skills]

peerDependencyRules:
  allowAny:
    # @effect/docgen declares `typescript: <7`; the TS6 alias satisfies it.
    - typescript
  allowedVersions:
    typescript: "*"

# Hold newly published versions for 24 hours.
minimumReleaseAge: 1440
